<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d0b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Mis Finanzas</title>
<style>
:root{
 --bg:#f5f5f5;--card:#ffffff;--card2:#f0f0f0;--line:#d9d9d9;
 --text:#202020;--muted:#707070;--green:#4f8f2f;--green2:#3f7425;
 --red:#c94d4d;--yellow:#a87916;--shadow:0 4px 18px #0002;
}
body.dark{
 --bg:#080c0a;--card:#111815;--card2:#151d19;--line:#28332e;
 --text:#e7eee9;--muted:#8c9891;--green:#9be85c;--green2:#5b9d31;
 --red:#ed6b6b;--yellow:#e7bd55;--shadow:0 8px 28px #0007;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:760px;margin:auto;padding:22px 18px 42px}
.header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo{font-size:27px;filter:saturate(.9)}
h1{font-size:29px;line-height:1;margin:0;font-weight:700;letter-spacing:-.7px}
.period{margin-top:7px;color:#9aa49f;font-size:16px}
.hero{
 background:linear-gradient(145deg,#121a16,#101613);
 border:1px solid #2b3731;border-radius:25px;padding:24px 26px 20px;
 box-shadow:var(--shadow);margin-bottom:20px
}
.hero-title{color:#8d9992;font-size:16px;margin-bottom:5px}
.hero-balance{font-size:48px;line-height:1.1;font-weight:750;color:var(--green);letter-spacing:-1.5px}
.hero-row{display:flex;justify-content:space-between;margin-top:20px;font-size:16px;color:#9ba59f}
.income b{color:var(--green)} .expense b{color:var(--red)}
.tabs{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding:0 0 17px}
.tabs::-webkit-scrollbar{display:none}
.tab{
 flex:0 0 auto;border:1px solid #303a36;background:#18201d;color:#d8dfdb;
 border-radius:13px;padding:12px 18px;font-size:16px
}
.tab.active{border-color:#78b94c;color:var(--green);background:#142016}
.content{position:relative}
.day-carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;scrollbar-width:none}
.day-carousel::-webkit-scrollbar{display:none}
.day{
 flex:0 0 100%;scroll-snap-align:start;background:var(--card);
 border:1px solid #29342f;border-radius:23px;padding:23px 25px;box-shadow:var(--shadow)
}
.day-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:17px;margin-bottom:16px}
.day-head h2{margin:0;font-size:24px}
.day-count{font-size:13px;color:#9ca6a1;border:1px solid #35403b;padding:6px 9px;border-radius:9px}
.section-title{font-size:19px;font-weight:650;margin:15px 0 8px}
.section-title.in{color:#cfe8c1}.section-title.out{color:#f0b2b2}
.row{display:grid;grid-template-columns:1fr 145px;align-items:center;gap:12px;padding:7px 0}
.row span{font-size:17px}
input[type=number],.text-input{
 width:100%;background:#0b100e;border:1px solid #34403a;color:#e9efeb;
 border-radius:13px;padding:11px 12px;text-align:right;outline:none
}
input:focus,textarea:focus,select:focus{border-color:#6fa945;box-shadow:0 0 0 2px #6fa94522}
.total{display:flex;justify-content:flex-end;border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-weight:650;font-size:17px}
.total.green{color:var(--green)} .total.red{color:var(--red)}
.desc{margin-top:5px}
.desc input{text-align:left;font-size:14px}
.notes{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.notes label{display:block;font-weight:650;margin-bottom:7px}
textarea{width:100%;min-height:78px;background:#0b100e;border:1px solid #34403a;color:#e9efeb;border-radius:13px;padding:11px;resize:vertical}
.day-balance{margin-top:15px;padding:12px 14px;background:#122116;border:1px solid #314b31;border-radius:13px;text-align:center;color:#a8b3ac}
.day-balance b{color:var(--green);font-size:18px}
.swipe{display:flex;justify-content:center;gap:5px;padding:12px}
.dot{width:7px;height:7px;border-radius:50%;background:#35403b}.dot.active{background:var(--green);width:20px;border-radius:8px}
.pixel-line{height:10px;margin:22px -25px -23px;border-radius:0 0 22px 22px;
 background:repeating-linear-gradient(90deg,#273c20 0 12px,#3d6427 12px 24px,#1b2918 24px 35px);
 opacity:.9
}
.panel{display:none;background:var(--card);border:1px solid #29342f;border-radius:23px;padding:20px;box-shadow:var(--shadow)}
.panel.show{display:block}
.panel h2{margin:0 0 15px;font-size:22px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px}
.card span{color:var(--muted);font-size:13px}.card b{display:block;font-size:21px;margin-top:4px}
.progress{height:12px;background:#27302c;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);border-radius:10px}
.category{display:grid;grid-template-columns:34px 1fr 80px;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.cat-icon{font-size:20px;text-align:center}.cat-name{font-weight:600}.cat-sub{font-size:12px;color:var(--muted);margin-top:3px}.cat-money{text-align:right}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:30;align-items:flex-end}
.modal.show{display:flex}
.modal-box{width:min(760px,100%);margin:auto;background:#111815;border:1px solid #303b35;border-radius:22px 22px 0 0;padding:20px}
.modal-box label{display:block;color:#aab4ae;margin:12px 0}
.modal-box input,.modal-box select{width:100%;text-align:left;background:#0b100e;color:#eee;border:1px solid #34403a;border-radius:12px;padding:11px;margin-top:5px}
.actions{display:flex;gap:9px;margin-top:16px}.actions button{flex:1}
.primary{background:#9be85c;color:#081006;border:0;border-radius:12px;padding:12px 15px;font-weight:700}
.secondary{background:#27312d;color:#e7eee9;border:1px solid #3b4741;border-radius:12px;padding:12px 15px}
.danger{background:#3a1c1c;color:#ffb1b1;border:1px solid #633333}
.history-item{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:12px 0}
.small{font-size:12px;color:var(--muted)}
.search{display:flex;gap:8px}.search input{text-align:left}
@media(max-width:520px){
 .app{padding:18px 14px 35px}
 h1{font-size:28px}.hero{padding:21px 22px;border-radius:23px}
 .hero-balance{font-size:46px}.hero-row{font-size:15px}
 .day{padding:20px 24px}.day-head h2{font-size:22px}
 .row{grid-template-columns:1fr 128px}.row span{font-size:16px}
 .tab{padding:11px 16px}
}

html,body{overflow-x:hidden;overflow-y:auto}
body{-webkit-overflow-scrolling:touch}
.tabs{touch-action:pan-x pan-y;overscroll-behavior-x:contain}
.day-carousel{touch-action:pan-x pan-y;overscroll-behavior-x:contain;overscroll-behavior-y:auto}
.tab{border-color:var(--line);background:var(--card2);color:var(--text)}
.tab.active{border-color:var(--green);color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--card))}
input[type=number],.text-input,textarea{background:var(--card);border-color:var(--line);color:var(--text)}
.panel,.day{border-color:var(--line)}

.pie-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:18px}.pie-chart{width:230px;height:230px;border-radius:50%;display:grid;place-items:center}.pie-center{width:105px;height:105px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}.pie-center span{font-size:12px;color:var(--muted)}.pie-center b{font-size:18px}.pie-legend{width:100%;display:grid;gap:8px}.pie-item{display:grid;grid-template-columns:14px 1fr auto;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.pie-dot{width:12px;height:12px;border-radius:50%}
:root{--pie-comida:#5b8ff9;--pie-transporte:#61c0bf;--pie-casa:#7b6fd0;--pie-pareja:#e67e9e;--pie-ocio:#e7b84b;--pie-otros:#9aa0a6}
body.dark{--pie-comida:#6fa8ff;--pie-transporte:#62c7c2;--pie-casa:#8c7fe0;--pie-pareja:#e98dab;--pie-ocio:#e5bd55;--pie-otros:#9ca3af}
</style>
</head>
<body>
<div class="app">
 <header class="header"><div class="logo">◇</div><div><h1>Mis Finanzas</h1><div class="period" id="period"></div></div></header>

 <section class="hero">
   <div class="hero-title">Saldo disponible del período</div>
   <div class="hero-balance" id="heroBalance">$0</div>
   <div class="hero-row"><span class="income">Ingresos <b id="heroIncome">$0</b></span><span class="expense">Gastos <b id="heroExpense">$0</b></span></div>
 </section>

 <nav class="tabs">
   <button class="tab active" onclick="newPeriod()">Nuevo período</button>
   <button class="tab" onclick="panel('summary')">Resumen</button>
   <button class="tab" onclick="panel('history')">Historial</button>
   <button class="tab" onclick="panel('total')">Total período</button>
   <button class="tab" onclick="panel('budget')">Presupuesto</button>
   <button class="tab" onclick="panel('analysis')">Análisis</button>
   <button class="tab" onclick="panel('search')">Buscar</button>
   <button class="tab" onclick="toggleDark()">☾</button>
 </nav>

 <div id="days"></div>
 <div id="dots" class="swipe"></div>

 <section id="summary" class="panel"></section>
 <section id="total" class="panel"></section>
 <section id="budget" class="panel"></section>
 <section id="analysis" class="panel"></section>
 <section id="history" class="panel"></section>
 <section id="search" class="panel"></section>
</div>

<div id="newModal" class="modal"><div class="modal-box">
 <h2>Nuevo período</h2>
 <label>Fecha de inicio<input type="date" id="newDate"></label>
 <label>Días<input type="number" id="newLen" value="15" min="1" max="366"></label>
 <div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="createPeriod()">Crear período</button></div>
</div></div>

<script>
const income=['diet','extras'];
const expenses=['comida','transporte','internet','seguro','ocio','prestamos','otros'];
const names={diet:'Dietética',extras:'Extras',comida:'Comida',transporte:'Transporte',internet:'Internet',seguro:'Seguro',ocio:'Ocio',prestamos:'Préstamos',otros:'Otros'};
const icons={comida:'🍔',transporte:'▤',internet:'◆',seguro:'◈',ocio:'●',prestamos:'▣',otros:'■'};
let state=JSON.parse(localStorage.getItem('fin_state_v3')||'null');
if(!state) state={nextId:2,current:1,periods:[{id:1,start:'2026-08-11',days:15}]};
let budgets=JSON.parse(localStorage.getItem('fin_budgets_v5')||'{}');
function save(){localStorage.setItem('fin_state_v3',JSON.stringify(state));localStorage.setItem('fin_budgets_v5',JSON.stringify(budgets))}
function k(p,c,i){return 'fin3_'+p.id+'_'+c+i}
function dk(p,c,i){return 'fin5_desc_'+p.id+'_'+c+i}
function nk(p,i){return 'fin3_'+p.id+'_note'+i}
function money(n){return '$'+Math.round(n||0).toLocaleString('es-AR')}
function dateAdd(s,n){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function dateText(s){return new Date(s+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'numeric'})}
function dayText(s){return new Date(s+'T12:00:00').toLocaleDateString('es-AR',{weekday:'long'})}
function current(){return state.periods.find(p=>p.id===state.current)}
function val(p,c,i){return Number(localStorage.getItem(k(p,c,i)))||0}
function totals(p){
 let inc=0,g=0;for(let i=0;i<p.days;i++){income.forEach(c=>inc+=val(p,c,i));expenses.forEach(c=>g+=val(p,c,i))}
 return {inc,g,b:inc-g}
}
function render(){
 const p=current();if(!p)return;
 document.getElementById('period').textContent=dateText(p.start)+' → '+dateText(dateAdd(p.start,p.days-1))+' · '+p.days+' días';
 const t=totals(p);document.getElementById('heroBalance').textContent=money(t.b);document.getElementById('heroIncome').textContent=money(t.inc);document.getElementById('heroExpense').textContent=money(t.g);
 const box=document.getElementById('days');box.className='day-carousel';box.innerHTML='';
 for(let i=0;i<p.days;i++){
  let s=dateAdd(p.start,i),inc=income.reduce((a,c)=>a+val(p,c,i),0),g=expenses.reduce((a,c)=>a+val(p,c,i),0);
  const d=document.createElement('section');d.className='day';
  d.innerHTML='<div class="day-head"><h2>'+cap(dayText(s))+' '+dateText(s)+'</h2><span class="day-count">'+(i+1)+'/'+p.days+'</span></div>'+
   '<div class="section-title in">Ingresos</div>'+income.map(c=>row(names[c],c,i)).join('')+
   '<div class="total green" data-day-income="'+i+'">Total ingresos: '+money(inc)+'</div>'+
   '<div class="section-title out">Gastos</div>'+expenses.map(c=>row(names[c],c,i)).join('')+
   '<div class="total red" data-day-expense="'+i+'">Total gastos: '+money(g)+'</div>'+
   '<div class="notes"><label>Notas del día</label><textarea id="note'+i+'" placeholder="Anotá algo sobre este día...">'+esc(localStorage.getItem(nk(p,i))||'')+'</textarea></div>'+
   '<div class="day-balance" data-day-balance="'+i+'">Saldo del día: <b>'+money(inc-g)+'</b></div><div class="pixel-line"></div>';
  box.appendChild(d);
 }
 box.querySelectorAll('input[data-key]').forEach(e=>e.addEventListener('input',e=>{
   localStorage.setItem(e.target.dataset.key,Number(e.target.value)||0);
   refreshTotalsOnly();
 }));
 box.querySelectorAll('textarea').forEach((e,i)=>e.addEventListener('input',()=>localStorage.setItem(nk(p,i),e.value)));
 dots();
}
function refreshTotalsOnly(){
 const p=current(); if(!p)return;
 const t=totals(p);
 document.getElementById('heroBalance').textContent=money(t.b);
 document.getElementById('heroIncome').textContent=money(t.inc);
 document.getElementById('heroExpense').textContent=money(t.g);
 const box=document.getElementById('days');
 for(let i=0;i<p.days;i++){
   const inc=income.reduce((a,c)=>a+val(p,c,i),0);
   const g=expenses.reduce((a,c)=>a+val(p,c,i),0);
   const ie=box.querySelector('[data-day-income=\"'+i+'\"]');
   const ge=box.querySelector('[data-day-expense=\"'+i+'\"]');
   const be=box.querySelector('[data-day-balance=\"'+i+'\"] b');
   if(ie)ie.textContent='Total ingresos: '+money(inc);
   if(ge)ge.textContent='Total gastos: '+money(g);
   if(be)be.textContent=money(inc-g);
 }
 if(document.getElementById('analysis')?.classList.contains('show'))renderAnalysis();
}
function row(label,c,i){
 return '<div class="row"><span>'+label+'</span><input type="number" min="0" step="1" inputmode="numeric" data-key="'+k(current(),c,i)+'" value="'+val(current(),c,i)+'"></div>';
}
function dots(){
 const p=current(),d=document.getElementById('dots');d.innerHTML='';
 for(let i=0;i<p.days;i++){let x=document.createElement('i');x.className='dot'+(i===0?' active':'');d.appendChild(x)}
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function showDays(){
 document.getElementById('days').style.display='';
 document.getElementById('dots').style.display='';
 document.querySelectorAll('.panel').forEach(x=>x.classList.remove('show'));
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 const first=document.querySelector('.tab'); if(first) first.classList.add('active');
}
function panel(id){
 document.getElementById('days').style.display='none';
 document.getElementById('dots').style.display='none';
 document.querySelectorAll('.panel').forEach(x=>x.classList.remove('show'));
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 const e=document.getElementById(id);e.classList.add('show');
 const tabs=[...document.querySelectorAll('.tab')];
 const ids=['summary','history','total','budget','analysis','search'];
 const idx=ids.indexOf(id); if(idx>=0 && tabs[idx+1]) tabs[idx+1].classList.add('active');
 if(id==='summary'||id==='total')renderSummary();
 if(id==='budget')renderBudget();
 if(id==='analysis')renderAnalysis();
 if(id==='history')renderHistory();
 if(id==='search')renderSearch();
}
function renderSummary(){
 const p=current(),t=totals(p),el=document.getElementById('summary');el.innerHTML='<h2>Resumen del período</h2><div class="cards">'+
  card('Saldo disponible',money(t.b),'green')+card('Ingresos',money(t.inc),'green')+card('Gastos',money(t.g),'red')+card('Promedio diario',money(t.g/p.days),'yellow')+'</div>'+
  '<div style="margin-top:17px"><div class="small">Presupuesto utilizado</div><div style="display:flex;justify-content:space-between;margin:5px 0 7px"><b>'+money(t.g)+'</b><b>'+Math.round(t.g/(Object.values(budgets).reduce((a,b)=>a+Number(b||0),0)||1)*100)+'%</b></div><div class="progress"><i style="width:'+Math.min(100,t.g/(Object.values(budgets).reduce((a,b)=>a+Number(b||0),0)||1)*100)+'%"></i></div></div>'+
  '<div style="margin-top:20px"><h3>Gastos por categoría</h3>'+expenses.map(c=>'<div class="category"><div class="cat-icon">'+icons[c]+'</div><div><div class="cat-name">'+names[c]+'</div><div class="cat-sub">'+money(periodCat(p,c))+'</div></div><div class="cat-money">'+Math.round(periodCat(p,c)/(t.g||1)*100)+'%</div></div>').join('')+'</div>';
 document.getElementById('total').innerHTML=el.innerHTML.replace('<h2>Resumen del período</h2>','<h2>Total del período</h2>');
}
function card(a,b,c){return '<div class="card"><span>'+a+'</span><b style="color:var(--'+c+')">'+b+'</b></div>'}
function periodCat(p,c){let n=0;for(let i=0;i<p.days;i++)n+=val(p,c,i);return n}
function renderBudget(){
 const p=current();let totalBudget=Object.values(budgets).reduce((a,b)=>a+Number(b||0),0);
 document.getElementById('budget').innerHTML='<h2>Presupuesto por categoría</h2>'+expenses.map(c=>{
  let spent=periodCat(p,c),b=Number(budgets[c]||0),pct=b?Math.round(spent/b*100):0;
  return '<div class="category"><div class="cat-icon">'+icons[c]+'</div><div><div class="cat-name">'+names[c]+'</div><div class="cat-sub">'+money(spent)+(b?' / '+money(b):'')+'</div><div class="progress"><i style="width:'+Math.min(100,pct)+'%;background:'+(pct>100?'var(--red)':'var(--green)')+'"></i></div></div><div class="cat-money">'+(b?pct+'%':'—')+'</div></div>';
 }).join('')+'<p class="small">La edición de presupuestos puede agregarse en una próxima versión sin cambiar los datos actuales.</p>';
}
function renderAnalysis(){
 const p=current(),t=totals(p),prev=state.periods.filter(x=>x.id!==p.id).sort((a,b)=>b.id-a.id)[0],pt=prev?totals(prev):null;
 const vals=expenses.map(c=>({c,v:periodCat(p,c)})).filter(x=>x.v>0),total=vals.reduce((a,x)=>a+x.v,0);
 let deg=0;
 const stops=vals.map(x=>{const a=deg;deg+=total?x.v/total*360:0;return 'var(--pie-'+x.c+') '+a+'deg '+deg+'deg'}).join(',');
 const max=vals.reduce((a,x)=>!a||x.v>a.v?x:a,null);
 document.getElementById('analysis').innerHTML='<h2>Análisis</h2><div class="cards">'+card('Mayor gasto',max?names[max.c]:'Sin gastos','green')+card('Total gastos',money(total),'red')+'</div>'+ '<div class="pie-wrap"><div class="pie-chart" style="background:'+(total?'conic-gradient('+stops+')':'var(--card2)')+'"><div class="pie-center"><span>Total</span><b>'+money(total)+'</b></div></div>'+ '<div class="pie-legend">'+(vals.length?vals.map(x=>'<div class="pie-item"><span class="pie-dot" style="background:var(--pie-'+x.c+')"></span><span>'+names[x.c]+'</span><b>'+Math.round(x.v/total*100)+'% · '+money(x.v)+'</b></div>').join(''):'<div class="small">Todavía no hay gastos registrados.</div>')+'</div></div>'+ '<div style="margin-top:18px"><h3>Comparación</h3>'+(pt?'<p>Período anterior: <b>'+money(pt.g)+'</b> en gastos.</p><p>Período actual: <b>'+money(t.g)+'</b>.</p><p style="color:'+(t.g<=pt.g?'var(--green)':'var(--red)')+'">'+(t.g<=pt.g?'Gastaste menos que en el período anterior.':'Gastaste más que en el período anterior.')+'</p>':'<p class="small">Cuando tengas otro período podremos compararlos.</p>')+'</div>';
}

function renderHistory(){
 const e=document.getElementById('history');e.innerHTML='<h2>Historial</h2>'+state.periods.slice().reverse().map(p=>{let t=totals(p);return '<div class="history-item"><div><b>'+dateText(p.start)+' → '+dateText(dateAdd(p.start,p.days-1))+'</b><div class="small">'+p.days+' días · Gastos '+money(t.g)+' · Saldo '+money(t.b)+'</div></div><button class="secondary" onclick="openPeriod('+p.id+')">Abrir</button></div>'}).join('');
}
function renderSearch(){
 document.getElementById('search').innerHTML='<h2>Buscar</h2><div class="search"><input id="q" placeholder="SUBE, cine, supermercado..." oninput="doSearch()"><button class="secondary" onclick="document.getElementById(\'q\').value=\'\';doSearch()">Limpiar</button></div><div id="results"></div>';
}
function doSearch(){
 const q=(document.getElementById('q').value||'').toLowerCase(),r=document.getElementById('results');if(!q){r.innerHTML='<p class="small">Buscá descripciones o notas.</p>';return}
 let a=[];for(const p of state.periods)for(let i=0;i<p.days;i++){let n=localStorage.getItem(nk(p,i))||'';if(n.toLowerCase().includes(q))a.push('<div class="category"><div>📝</div><div><b>'+dateText(dateAdd(p.start,i))+'</b><div class="cat-sub">'+esc(n)+'</div></div></div>')}
 r.innerHTML=a.length?a.join(''):'<p class="small">No encontré coincidencias.</p>';
}
function newPeriod(){showDays();document.getElementById('newDate').value=new Date().toISOString().slice(0,10);document.getElementById('newLen').value=15;document.getElementById('newModal').classList.add('show')}
function closeModal(){document.getElementById('newModal').classList.remove('show')}
function createPeriod(){let s=document.getElementById('newDate').value,n=Math.max(1,Math.min(366,Number(document.getElementById('newLen').value)||15));let p={id:state.nextId++,start:s,days:n};state.periods.push(p);state.current=p.id;save();closeModal();render();window.scrollTo(0,0)}
function openPeriod(id){state.current=id;save();showDays();render();window.scrollTo(0,0)}
function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('fin_theme',document.body.classList.contains('dark')?'dark':'light');}
showDays();
render();
