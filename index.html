<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d0b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Mis Finanzas</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#070b09;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:auto;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
body{min-width:320px}
.stage{position:relative;touch-action:pan-y;width:min(100vw,1536px);aspect-ratio:1536/1024;margin:0 auto;background:#080d0b;
.hit{position:absolute;border:0;background:transparent;color:transparent;padding:0;cursor:pointer;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
.input{position:absolute;touch-action:manipulation;background:rgba(8,13,11,.97);border:1px solid #29352f;color:#eee;border-radius:8px;text-align:right;padding:5px 8px;font-size:clamp(10px,1.08vw,17px);outline:0}
.input:focus{border-color:#83d64b}
.note{position:absolute;touch-action:manipulation;background:rgba(8,13,11,.97);border:1px solid #29352f;color:#eee;border-radius:7px;padding:7px;font-size:clamp(9px,.9vw,14px);resize:none}
.overlay{position:absolute;pointer-events:none}
.text{position:absolute;white-space:nowrap}
.panel{position:absolute;background:#0d1310f5;border:1px solid #29352f;border-radius:12px;color:#eee;padding:18px;display:none;z-index:20;box-shadow:0 15px 45px #000c}
.panel.show{display:block}
button.action{border:1px solid #334038;background:#151c19;color:#ddd;border-radius:8px;padding:8px 12px}
.panel h3{margin:0 0 14px}
.rowbtn{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #26302c}
@media(max-width:700px){
 .stage{width:100vw}
}
</style>
</head>
<body>
<div class="stage" id="stage">

<!-- INTERACTIVE NAVIGATION ICONS -->
<button class="hit" style="left:31.2%;top:2.0%;width:4%;height:6%" onclick="showPanel('summary')" aria-label="Resumen"></button>
<button class="hit" style="left:37.5%;top:2.0%;width:4%;height:6%" onclick="showPanel('history')" aria-label="Historial"></button>
<button class="hit" style="left:43.5%;top:2.0%;width:4%;height:6%" onclick="showPanel('summary')" aria-label="Resumen"></button>
<button class="hit" style="left:49.3%;top:2.0%;width:4%;height:6%" onclick="showPanel('calendar')" aria-label="Calendario"></button>
<button class="hit" style="left:54.0%;top:2.0%;width:4%;height:6%" onclick="showPanel('search')" aria-label="Buscar"></button>
<button class="hit" style="left:59.2%;top:2.0%;width:4%;height:6%" onclick="showPanel('settings')" aria-label="Configuración"></button>
<button class="hit" style="left:64.0%;top:2.0%;width:4%;height:6%" onclick="toggleTheme()" aria-label="Modo oscuro"></button>

<!-- LEFT DAY NAVIGATION -->
<button class="hit" style="left:1.3%;top:87.8%;width:4.2%;height:5.4%" onclick="changeDay(-1)" aria-label="Día anterior"></button>
<button class="hit" style="left:19.9%;top:87.8%;width:4.2%;height:5.4%" onclick="showPanel('calendar')" aria-label="Calendario"></button>
<button class="hit" style="left:39.0%;top:87.8%;width:4.2%;height:5.4%" onclick="changeDay(1)" aria-label="Día siguiente"></button>

<!-- LEFT INCOME INPUTS -->
<input class="input" id="diet" type="text" inputmode="numeric" autocomplete="off" value="25000" style="left:19.2%;top:32.2%;width:18.4%;height:3.3%" aria-label="Dietética">
<input class="input" id="extras" type="text" inputmode="numeric" autocomplete="off" value="10000" style="left:19.2%;top:35.0%;width:18.4%;height:3.3%" aria-label="Extras">

<!-- LEFT EXPENSE INPUTS -->
<input class="input" id="comida" type="text" inputmode="numeric" autocomplete="off" value="4500" style="left:19.2%;top:46.7%;width:18.4%;height:3.1%">
<input class="input" id="transporte" type="text" inputmode="numeric" autocomplete="off" value="2000" style="left:19.2%;top:50.2%;width:18.4%;height:3.1%">
<input class="input" id="internet" type="text" inputmode="numeric" autocomplete="off" value="0" style="left:19.2%;top:53.7%;width:18.4%;height:3.1%">
<input class="input" id="seguro" type="text" inputmode="numeric" autocomplete="off" value="0" style="left:19.2%;top:57.2%;width:18.4%;height:3.1%">
<input class="input" id="ocio" type="text" inputmode="numeric" autocomplete="off" value="4000" style="left:19.2%;top:60.7%;width:18.4%;height:3.1%">
<input class="input" id="prestamos" type="text" inputmode="numeric" autocomplete="off" value="0" style="left:19.2%;top:64.2%;width:18.4%;height:3.1%">
<input class="input" id="otros" type="text" inputmode="numeric" autocomplete="off" value="0" style="left:19.2%;top:67.7%;width:18.4%;height:3.1%">

<textarea class="note" id="note" style="left:3.0%;top:82.7%;width:21.1%;height:5.0%" aria-label="Notas del día">Le cargué $2.000 de SUBE a mi pareja.</textarea>

<!-- OVERLAY DYNAMIC TEXT -->
<div class="text" id="dayBalance" style="left:3.1%;top:18.0%;font-size:clamp(22px,2.6vw,42px);font-weight:700;color:#8ee34d">$24.500</div>
<div class="text" id="incomeTotal" style="left:18.7%;top:38.4%;font-size:clamp(14px,1.45vw,22px);font-weight:700;color:#8ee34d">$35.000</div>
<div class="text" id="expenseTotal" style="left:18.7%;top:76.0%;font-size:clamp(14px,1.45vw,22px);font-weight:700;color:#ef5555">$10.500</div>

<div class="text" id="periodBalance" style="left:30.0%;top:17.8%;font-size:clamp(27px,3.2vw,50px);font-weight:700;color:#8ee34d">$106.500</div>
<div class="text" id="periodIncome" style="left:30.1%;top:29.8%;font-size:clamp(16px,1.65vw,25px);color:#8ee34d">$250.000</div>
<div class="text" id="periodExpense" style="left:42.4%;top:29.8%;font-size:clamp(16px,1.65vw,25px);color:#ef5555">$143.500</div>

<!-- CATEGORY CLICK AREAS -->
<button class="hit" style="left:2.5%;top:45.2%;width:22%;height:7%" onclick="category('Comida')"></button>
<button class="hit" style="left:2.5%;top:48.7%;width:22%;height:7%" onclick="category('Transporte')"></button>
<button class="hit" style="left:2.5%;top:52.2%;width:22%;height:7%" onclick="category('Internet')"></button>
<button class="hit" style="left:2.5%;top:55.7%;width:22%;height:7%" onclick="category('Seguro')"></button>
<button class="hit" style="left:2.5%;top:59.2%;width:22%;height:7%" onclick="category('Ocio')"></button>
<button class="hit" style="left:2.5%;top:62.7%;width:22%;height:7%" onclick="category('Préstamos')"></button>
<button class="hit" style="left:2.5%;top:66.2%;width:22%;height:7%" onclick="category('Otros')"></button>

<!-- RIGHT THEME / ICON AREAS -->
<button class="hit" style="left:67.0%;top:60.0%;width:9%;height:13%" onclick="theme('overworld')"></button>
<button class="hit" style="left:77.0%;top:60.0%;width:9%;height:13%" onclick="theme('nether')"></button>
<button class="hit" style="left:87.0%;top:60.0%;width:9%;height:13%" onclick="theme('end')"></button>
<button class="hit" style="left:67.0%;top:77.0%;width:5%;height:7%" onclick="icon('grass')"></button>
<button class="hit" style="left:72.0%;top:77.0%;width:5%;height:7%" onclick="icon('pickaxe')"></button>
<button class="hit" style="left:77.0%;top:77.0%;width:5%;height:7%" onclick="icon('furnace')"></button>
<button class="hit" style="left:82.0%;top:77.0%;width:5%;height:7%" onclick="icon('chest')"></button>
<button class="hit" style="left:87.0%;top:77.0%;width:5%;height:7%" onclick="icon('emerald')"></button>
<button class="hit" style="left:92.0%;top:77.0%;width:5%;height:7%" onclick="icon('craft')"></button>

<!-- PANELS -->
<div id="summary" class="panel" style="left:28%;top:10%;width:40%;height:auto">
<h3>Resumen del período</h3>
<div class="rowbtn"><span>Ingresos</span><b id="p1">$250.000</b></div>
<div class="rowbtn"><span>Gastos</span><b id="p2">$143.500</b></div>
<div class="rowbtn"><span>Saldo</span><b id="p3">$106.500</b></div>
<button class="action" onclick="closePanels()">Cerrar</button>
</div>

<div id="history" class="panel" style="left:28%;top:10%;width:40%">
<h3>Historial</h3>
<div class="rowbtn"><span>11/08 – 25/08</span><b>$106.500</b></div>
<div class="rowbtn"><span>Período anterior</span><b>—</b></div>
<button class="action" onclick="closePanels()">Cerrar</button>
</div>

<div id="calendar" class="panel" style="left:28%;top:10%;width:40%">
<h3>Calendario</h3>
<p>Período actual: 11/08 – 25/08</p>
<button class="action" onclick="changeDay(-1)">← Día anterior</button>
<button class="action" onclick="changeDay(1)">Día siguiente →</button>
<button class="action" onclick="closePanels()">Cerrar</button>
</div>

<div id="search" class="panel" style="left:28%;top:10%;width:40%">
<h3>Buscar</h3>
<input id="searchInput" style="width:100%;padding:10px;background:#0a0f0c;color:white;border:1px solid #344039;border-radius:8px" placeholder="Buscar en notas...">
<button class="action" style="margin-top:10px" onclick="closePanels()">Cerrar</button>
</div>

<div id="settings" class="panel" style="left:28%;top:10%;width:40%">
<h3>Configuración</h3>
<p>Los campos se guardan automáticamente en este dispositivo.</p>
<button class="action" onclick="closePanels()">Cerrar</button>
</div>

</div>

<script>
const ids=['diet','extras','comida','transporte','internet','seguro','ocio','prestamos','otros'];
function money(n){return '$'+Math.round(n||0).toLocaleString('es-AR')}
function update(){
 let inc=+diet.value+(+extras.value||0);
 let out=0; ['comida','transporte','internet','seguro','ocio','prestamos','otros'].forEach(id=>out+=+(document.getElementById(id).value||0));
 let bal=inc-out;
 document.getElementById('dayBalance').textContent=money(bal);
 document.getElementById('incomeTotal').textContent=money(inc);
 document.getElementById('expenseTotal').textContent=money(out);
 document.getElementById('periodBalance').textContent=money(106500+bal-24500);
 document.getElementById('periodIncome').textContent=money(250000+inc-35000);
 document.getElementById('periodExpense').textContent=money(143500+out-10500);
 localStorage.setItem('mis_finanzas_overlay',JSON.stringify({inc,out,note:note.value,vals:Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value]))}));
}
let saveTimer;
ids.forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener('keydown',e=>{
    if(e.key==='Enter') e.preventDefault();
  });
  el.addEventListener('input',()=>{
    // Keep only digits so the numeric keyboard behaves predictably.
    const cleaned=el.value.replace(/[^0-9]/g,'');
    if(el.value!==cleaned) el.value=cleaned;
    update();
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{},250);
  });
  el.addEventListener('blur',update);
});
note.addEventListener('input',()=>{
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>localStorage.setItem('mis_finanzas_note',note.value),150);
});
function showPanel(id){closePanels();document.getElementById(id).classList.add('show')}
document.querySelectorAll('.hit').forEach(btn=>{
  let downY=0;
  btn.addEventListener('pointerdown',e=>{downY=e.clientY},{passive:true});
  btn.addEventListener('pointermove',e=>{
    if(Math.abs(e.clientY-downY)>8) e.preventDefault();
  },{passive:false});
});
function closePanels(){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('show'))}
function category(c){alert(c+' — podés editar el importe en el panel de la izquierda.')}
function theme(t){alert('Tema seleccionado: '+t)}
function icon(i){alert('Icono seleccionado: '+i)}
function toggleTheme(){document.body.style.filter=document.body.style.filter?'':'brightness(.82)'}
function changeDay(n){alert(n<0?'Día anterior':'Día siguiente')}
try{
 const saved=JSON.parse(localStorage.getItem('mis_finanzas_overlay')||'null');
 if(saved?.vals)Object.entries(saved.vals).forEach(([id,v])=>{if(document.getElementById(id))document.getElementById(id).value=v});
 if(saved?.note)note.value=saved.note;
}catch(e){}
update();
</script>
</body>
</html>
