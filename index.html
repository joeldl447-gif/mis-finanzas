<script>
const ids=['diet','extras','comida','transporte','internet','seguro','ocio','prestamos','otros'];
function money(n){return '$'+Math.round(n||0).toLocaleString('es-AR')}
function update(){
 let inc=+diet.value+(+extras.value||0);
 let out=0; ['comida','transporte','internet','seguro','ocio','prestamos','otros'].forEach(id=>out+=+(document.getElementById(id).value||0));
 let bal=inc-out;
 document.getElementById('dayBalance').textContent=money(bal);
 document.getElementById('incomeTotal').textContent=money(inc);
 document.getElementById('expenseTotal').textContent=money(out);
 document.getElementById('periodBalance').textContent=money(106500+bal-24500);
 document.getElementById('periodIncome').textContent=money(250000+inc-35000);
 document.getElementById('periodExpense').textContent=money(143500+out-10500);
 localStorage.setItem('mis_finanzas_overlay',JSON.stringify({inc,out,note:note.value,vals:Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value]))}));
}
let saveTimer;
ids.forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener('keydown',e=>{
    if(e.key==='Enter') e.preventDefault();
  });
  el.addEventListener('input',()=>{
    // Keep only digits so the numeric keyboard behaves predictably.
    const cleaned=el.value.replace(/[^0-9]/g,'');
    if(el.value!==cleaned) el.value=cleaned;
    update();
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{},250);
  });
  el.addEventListener('blur',update);
});
note.addEventListener('input',()=>{
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>localStorage.setItem('mis_finanzas_note',note.value),150);
});
function showPanel(id){closePanels();document.getElementById(id).classList.add('show')}
document.querySelectorAll('.hit').forEach(btn=>{
  let downY=0;
  btn.addEventListener('pointerdown',e=>{downY=e.clientY},{passive:true});
  btn.addEventListener('pointermove',e=>{
    if(Math.abs(e.clientY-downY)>8) e.preventDefault();
